name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'compiler-setup.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'compiler-installation'
          $checksum = '5116CC1703384AAC88B8D7A3B57F172AEA5DA32B6DF7355FB2F8247D23813C8F'
          Invoke-WebRequest -Uri 'https://github.com/ramensoftware/windhawk/releases/download/v1.7.3/windhawk_setup.exe' -OutFile $setup
          if ((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash -ne $checksum) {
            throw 'Compiler installer checksum mismatch.'
          }
          $installer = Start-Process -FilePath $setup -ArgumentList "/S /PORTABLE /D=$installDir" `
            -WindowStyle Hidden -PassThru -Wait
          if ($installer.ExitCode -ne 0) {
            throw "Compiler setup failed with exit code $($installer.ExitCode)."
          }

      - name: Build both variants and run tests
        shell: pwsh
        run: |
          $options = @{
            ToolchainRoot = (Join-Path $env:RUNNER_TEMP 'compiler-installation')
            Coverage = $true
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $options.ReleaseTag = $env:GITHUB_REF_NAME
          }
          ./build.ps1 @options

      - name: Upload both variants
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TOTP-flyout
          path: |
            build/release/TOTP-flyout.wh.cpp
            build/release/TOTP-flyout-setup.exe
            build/release/releases.win.json
            build/release/*-full.nupkg
            build/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload test coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-coverage
          path: |
            build/coverage/summary.txt
            build/coverage/coverage.json
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download both tested variants
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: TOTP-flyout
          path: dist

      - name: Publish one release for the tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          tag="$GITHUB_REF_NAME"
          package=$(jq -er '
            .Assets | select(length == 1) | .[0]
            | select(.Type == "Full" and .PackageId == "wondersalmon.TotpFlyout")
            | .FileName | select(test("^[A-Za-z0-9.-]+-full[.]nupkg$"))
          ' releases.win.json)
          files=(TOTP-flyout.wh.cpp TOTP-flyout-setup.exe releases.win.json "$package")
          assets=("${files[@]}" SHA256SUMS.txt)
          diff <(printf '%s\n' "${files[@]}" | sort) <(cut -c67- SHA256SUMS.txt | sort)
          sha256sum --check --strict SHA256SUMS.txt

          if existing=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets 2>/dev/null); then
            expected=$(printf '%s\n' "${assets[@]}" | jq -R . | jq -s 'sort')
            jq -e --argjson expected "$expected" '(.isDraft | not) and ([.assets[].name] | sort == $expected)' <<< "$existing"
            echo "The release for $tag is already published with both variants."
            exit 0
          fi

          flags=()
          if [[ "$tag" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "TOTP flyout $tag" "${flags[@]}" \
            --notes 'Includes the Windhawk mod, a per-user Windows installer, Velopack update files, and SHA-256 checksums.'
